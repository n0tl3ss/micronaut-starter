name: Windows Native CLI
on:
  push:
    branches:
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - '[1-9]+.[0-9]+.x'
jobs:
  build:
    name: Builds Windows Native CLI
    runs-on: windows-2022
    steps:
      - name: "⬇ Checkout the repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "☕️ Setup GraalVM"
        uses: graalvm/setup-graalvm@v1.5.3
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧪 Verify JVM External Command"
        run: ./gradlew micronaut-cli:test --tests io.micronaut.starter.cli.ExternalCommandSpec --no-daemon
      - name: "📸 Build the Native Image"
        run: ./gradlew micronaut-cli:nativeCompile --no-daemon
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME  }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      - name: "✅ Verify Build (Powershell)"
        shell: powershell
        run: ./starter-cli/build/native/nativeCompile/mn.exe --version
      - name: "✅ Verify Create App (Powershell)"
        run: ./starter-cli/build/native/nativeCompile/mn.exe create-app test
      - name: "✅ Verify External Command (Powershell)"
        shell: pwsh
        run: |
          $PSNativeCommandArgumentPassing = 'Standard'
          $external = Join-Path $env:RUNNER_TEMP "mn external space"
          New-Item -ItemType Directory -Path $external -Force | Out-Null
          $script = Join-Path $external "mn-hello.cmd"
          $marker = Join-Path $external "invoked.marker"
          $scriptContent = "@echo off`r`n>""$marker"" echo invoked`r`necho arg=%~1`r`nexit /b 7`r`n"
          Set-Content -Path $script -Value $scriptContent -Encoding ascii -NoNewline
          $env:PATH = "$external;$env:PATH"
          $mn = (Resolve-Path "./starter-cli/build/native/nativeCompile/mn.exe").Path

          $output = & $mn "--verbose" "hello" "three four" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 7) { throw "External command returned $LASTEXITCODE instead of 7" }
          if ($output.Trim() -ne "arg=three four") { throw "Unexpected external command output: $output" }

          $output = & $mn "--" "hello" "three four" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 7) { throw "External command with -- returned $LASTEXITCODE instead of 7" }
          if ($output.Trim() -ne "arg=three four") { throw "Unexpected external command output after --: $output" }

          $edgeScript = Join-Path $external "mn-edge.cmd"
          $edgeMarker = Join-Path $external "edge.marker"
          $edgeScriptContent = "@echo off`r`n>""$edgeMarker"" echo arg1=%~1 arg2=[%~2] arg3=[%~3]`r`nexit /b 7`r`n"
          Set-Content -Path $edgeScript -Value $edgeScriptContent -Encoding ascii -NoNewline
          $output = & $mn "edge" "three four" "" "tail\" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 7) { throw "External command edge case returned $LASTEXITCODE instead of 7" }
          $edgeArgs = (Get-Content -Raw $edgeMarker).Trim()
          if ($edgeArgs -ne "arg1=three four arg2=[] arg3=[tail\]") { throw "Unexpected edge-case arguments: $edgeArgs" }

          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            foreach ($dangerous in @("a&echo INJECTED", "%PATH%")) {
              $output = & $mn "hello" $dangerous 2>&1 | Out-String
              if ($LASTEXITCODE -ne 127) { throw "Dangerous external argument returned $LASTEXITCODE instead of 127" }
              if ($output -notmatch "command-shell metacharacters") { throw "Missing dangerous-argument diagnostic: $output" }
              if (Test-Path $marker) { throw "Batch command executed for dangerous argument: $dangerous" }
            }
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          # All deliberately nonzero child statuses were asserted above.
          exit 0
      - name: "✅ Verify Build (CMD)"
        shell: cmd
        run: starter-cli\\build\\native\\nativeCompile\\mn --version
      - name: "✅ Verify Create App (CMD)"
        shell: cmd
        run: starter-cli\\build\\native\\nativeCompile\\mn create-app test2
      - name: "🤐 ZIP Archive"
        run: |
          New-Item "./mn-win-amd64-snapshot/bin" -ItemType Directory -ea 0
          Move-Item -Path ./starter-cli/build/native/nativeCompile/mn.exe -Destination "./mn-win-amd64-snapshot/bin"
          Copy-Item "./LICENSE" -Destination "./mn-win-amd64-snapshot"
          Compress-Archive -Path "./mn-win-amd64-snapshot" -Update -DestinationPath ./mn-win-amd64-snapshot.zip
      - name: "🆙 Upload Snapshot"
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/5.2.x'
        uses: actions/upload-artifact@v7
        with:
          name: mn-win-amd64-snapshot
          path: ./mn-win-amd64-snapshot.zip
